name: patch-native-prices

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[native-price-patched]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch HomeTab price source
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('frontend/src/components/HomeTab.js')
          s = p.read_text()

          old = 'const [ethUsd, setEthUsd] = useState(null);'
          new = 'const [nativeUsd, setNativeUsd] = useState(null);'
          if old not in s:
              raise SystemExit('state marker not found')
          s = s.replace(old, new, 1)

          old_block = '''  useEffect(() => {\n    let cancelled = false;\n    async function loadPrice() {\n      try {\n        const response = await fetch("https://api.coingecko.com/api/v3/simple/price?ids=ethereum&vs_currencies=usd");\n        const data = await response.json();\n        if (!cancelled) setEthUsd(Number(data?.ethereum?.usd || 0));\n      } catch { if (!cancelled) setEthUsd(null); }\n    }\n    loadPrice();\n    const timer = window.setInterval(loadPrice, 60000);\n    return () => { cancelled = true; window.clearInterval(timer); };\n  }, []);'''

          new_block = '''  useEffect(() => {\n    let cancelled = false;\n    async function loadPrice() {\n      try {\n        const url = backendUrl ? `${backendUrl.replace(/\\/$/, "")}/api/prices?chainid=${network.chainId}` : "";\n        if (!url) throw new Error("Price service unavailable");\n        const response = await fetch(url);\n        const data = await response.json();\n        if (!response.ok) throw new Error(data?.error || "Price service unavailable");\n        if (!cancelled) setNativeUsd(Number(data?.priceUsd || 0));\n      } catch (error) {\n        console.log("Native price error:", error.message);\n        if (!cancelled) setNativeUsd(null);\n      }\n    }\n    loadPrice();\n    const timer = window.setInterval(loadPrice, 60000);\n    return () => { cancelled = true; window.clearInterval(timer); };\n  }, [selectedNetwork, network.chainId, backendUrl]);'''
          if old_block not in s:
              raise SystemExit('price effect marker not found')
          s = s.replace(old_block, new_block, 1)

          s = s.replace('Number(ethUsd || 0)', 'Number(nativeUsd || 0)')
          s = s.replace('}, [balance, ethUsd]);', '}, [balance, nativeUsd]);')
          s = s.replace('{nativeSymbol === "ETH" ? portfolioUsd : "Live price available in Portfolio"}', '{portfolioUsd}')
          s = s.replace('{ethUsd ? "Live ETH price" : "Price feed"}', '{nativeUsd ? "Live price" : "Price feed"}')
          s = s.replace('{nativeSymbol === "ETH" ? portfolioUsd : "—"}', '{portfolioUsd}')
          s = s.replace('{ethUsd && nativeSymbol === "ETH" ? `$${ethUsd.toLocaleString()}/ETH` : "Native asset"}', '{nativeUsd ? `$${nativeUsd.toLocaleString()}/${nativeSymbol}` : "Price unavailable"}')

          marker = '// [native-price-patched]'
          if marker not in s:
              s = s.replace('function HomeTab(', marker + '\n\nfunction HomeTab(', 1)
          p.write_text(s)
          PY

      - name: Commit patched HomeTab
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/components/HomeTab.js
          git rm .github/workflows/patch-native-prices.yml
          git commit -m "Update Home for live EVM prices [native-price-patched]"
          git push
